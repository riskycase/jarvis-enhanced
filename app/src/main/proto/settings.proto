syntax = "proto3";

option java_package = "com.riskycase.jarvisEnhanced";
option java_multiple_files = true;

message SettingsDataStore {
  optional int32 check_duration_milliseconds = 1;
  optional bool clear_notification_on_click = 2;
  optional string nasa_apod_api_key = 3;
}

message SocketSettings {
  optional string server_url = 1;
  optional string device_id = 2;
  optional string device_secret = 3;
}